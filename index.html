<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Personal Data Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 py-10 px-4">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">CANDIDATE PERSONAL DATA FORM</h2>
        
        <form id="candidateForm" class="space-y-6">
            <!-- Posisi -->
            <div class="bg-blue-50 p-4 rounded-md border border-blue-100">
                <label class="block font-semibold text-gray-700">Position Applied:</label>
                <input type="text" name="position_applied" required class="w-full mt-1 border rounded p-2">
            </div>

            <!-- I. PERSONAL -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-lg mb-3">I. PERSONAL INFORMATIONS</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="full_name" placeholder="Full Name" required class="border rounded p-2">
                    <input type="text" name="dob" placeholder="Date of Birth" class="border rounded p-2">
                    <textarea name="current_address" placeholder="Current Address" class="border rounded p-2 col-span-2"></textarea>
                    <input type="email" name="email" placeholder="Email" required class="border rounded p-2">
                    <input type="text" name="phone" placeholder="Phone Number" required class="border rounded p-2">
                </div>
            </div>

            <!-- II. EDUCATION -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-lg mb-3">II. EDUCATION BACKGROUND</h3>
                <div class="space-y-2">
                    <input type="text" name="edu_sma" placeholder="SMA/SMK (Institution, Major, Year)" class="w-full border rounded p-2">
                    <input type="text" name="edu_dip" placeholder="Diploma (Institution, Major, Year)" class="w-full border rounded p-2">
                    <input type="text" name="edu_bach" placeholder="Bachelor (Institution, Major, Year)" class="w-full border rounded p-2">
                </div>
            </div>

            <!-- III. FAMILY -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-lg mb-3">III. FAMILY BACKGROUND</h3>
                <input type="text" name="fam_wife" placeholder="Wife/Husband Name & Job" class="w-full border rounded p-2 mb-2">
                <input type="text" name="fam_child" placeholder="Children (Name, Age, Job)" class="w-full border rounded p-2">
            </div>

            <!-- IV. WORKING EXPERIENCE -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-lg mb-3">IV. WORKING EXPERIENCE (Start from Last)</h3>
                <div class="space-y-3">
                    <textarea name="exp1" placeholder="Experience 1 (Company, Pos, Period, Salary, Reason for Leaving)" class="w-full border rounded p-2 h-20"></textarea>
                    <textarea name="exp2" placeholder="Experience 2 (Company, Pos, Period, Salary, Reason for Leaving)" class="w-full border rounded p-2 h-20"></textarea>
                    <textarea name="exp3" placeholder="Experience 3 (Company, Pos, Period, Salary, Reason for Leaving)" class="w-full border rounded p-2 h-20"></textarea>
                </div>
            </div>

            <!-- V. SKILLS -->
            <div class="border-b pb-4">
                <h3 class="font-bold text-lg mb-3">V. SKILLS</h3>
                <input type="text" name="lang_skills" placeholder="Language (Scale 1-10)" class="w-full border rounded p-2 mb-2">
                <input type="text" name="comp_skills" placeholder="Computer Skills (Scale 1-10)" class="w-full border rounded p-2">
            </div>

            <!-- VI. REFERENCES -->
            <div class="pb-4">
                <h3 class="font-bold text-lg mb-3">VI. REFERENCES</h3>
                <input type="text" name="ref1" placeholder="Reference 1 (HR Name, Position, Company, Phone)" class="w-full border rounded p-2 mb-2">
                <input type="text" name="ref2" placeholder="Reference 2 (Name, Position, Company, Phone)" class="w-full border rounded p-2">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">KIRIM FORMULIR</button>
        </form>

        <div id="successMessage" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded text-center">Data Berhasil Dikirim!</div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx-uaREHEIZxycnuctP_8LmQgzEx2mm47xarKc_cm3U_uLKo1i7YLwdgk3ME7FLXPfr4w/exec';
        const form = document.getElementById('candidateForm');
        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(() => {
                    form.reset();
                    document.getElementById('successMessage').classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
